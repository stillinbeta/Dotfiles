- name: "get {{ repo_name }} key"
  get_url:
    url: "{{ key_url }}"
    dest: "{{ key_path }}"
    mode: 0644
  become: true
- name: "setup {{ repo_name }} repository"
  apt_repository:
    repo: "deb [arch=amd64 signed-by={{key_path}}] {{repo_url}}"
  become: true
- name: "install {{ repo_name }} packages"
  apt:
    name: "{{ package }}"
  become: true
